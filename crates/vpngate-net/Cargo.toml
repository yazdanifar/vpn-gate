[package]
name = "vpngate-net"
description = "Network engine without OS calls: TLS, SoftEther client, bridge, DNS, session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
getrandom = "0.2"
rsa = { version = "0.9", default-features = false, features = ["std", "sha1"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
serde_json = { version = "1", optional = true }
sha1 = "0.10"
sha2 = "0.10"
socket2 = "0.6.5"
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "rt", "macros", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
vpngate-core.workspace = true
vpngate-platform.workspace = true

[features]
# Test doubles (fake SoftEther server, replaying entropy) for other crates' tests.
testing = ["dep:serde_json"]

[dev-dependencies]
serde_json = "1"
vpngate-testkit.workspace = true
base64 = "0.23.1"
rcgen = "0.14.7"
proptest = { version = "1", default-features = false, features = ["std"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "test-util"] }
