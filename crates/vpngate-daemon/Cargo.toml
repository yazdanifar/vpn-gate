[package]
name = "vpngate-daemon"
description = "Privileged daemon binary: --probe, --connect, --daemon, --version"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vpngate-core.workspace = true
vpngate-net.workspace = true
vpngate-platform.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }

[dev-dependencies]
vpngate-net = { workspace = true, features = ["testing"] }
async-trait = "0.1.92"
vpngate-core.workspace = true
vpngate-ipc-client.workspace = true
tokio = { version = "1.54.1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }
