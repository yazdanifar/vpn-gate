[package]
name = "vpngate-uniffi"
description = "UniFFI API for the in-process Android engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bindgen_main.rs"
required-features = ["cli"]

[lints]
workspace = true

[features]
# The Kotlin binding generator (`cargo run --features cli --bin uniffi-bindgen`).
cli = ["uniffi/cli"]

[dependencies]
vpngate-core.workspace = true
vpngate-daemon = { path = "../vpngate-daemon" }
vpngate-net.workspace = true
vpngate-platform.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "io-util", "sync", "time", "macros"] }
uniffi = "0.32.2"

[dev-dependencies]
vpngate-net = { workspace = true, features = ["testing"] }
vpngate-ipc-client.workspace = true
async-trait = "0.1.92"
libc = "0.2.191"
vpngate-core.workspace = true
tokio = { version = "1.54.1", features = ["test-util"] }
