[package]
name = "vpngate-app-model"
description = "UI-toolkit-free state of the desktop apps (GTK today): session, server list, settings and the controller that drives the daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vpngate-core.workspace = true
vpngate-ipc-client.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["time", "sync", "rt"] }

[dev-dependencies]
vpngate-testkit.workspace = true
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "test-util"] }
