[package]
name = "vpngate-gtk"
description = "VPN Gate for Linux: GTK4 and libadwaita front end for the vpngate daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
vpngate-core = { path = "../../../crates/vpngate-core" }
vpngate-ipc-client = { path = "../../../crates/vpngate-ipc-client" }
vpngate-app-model = { path = "../../../crates/vpngate-app-model" }
gtk = { package = "gtk4", version = "0.10", features = ["v4_10"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }
async-channel = "2"
uuid = { version = "1", features = ["v4"] }
ksni = "0.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "sync"] }

[dev-dependencies]
vpngate-testkit = { path = "../../../crates/vpngate-testkit" }
zbus = { version = "5", default-features = false, features = ["tokio"] }

# In-process UI tests: one thread, GTK initialised once, run under Xvfb (they skip themselves without VPNGATE_UI_TESTS).
[[test]]
name = "ui"
harness = false

# `cargo deb --no-build` (scripts/build-deb.sh): the daemon comes from the root workspace, the app from this one, and
# both must be built into the same target dir (the script sets CARGO_TARGET_DIR to the root one), so run it through the
# script. The assets start with target/release/ because cargo-deb only treats such paths as binaries.
[package.metadata.deb]
name = "vpn-gate"
maintainer = "VPN Gate <noreply@users.noreply.github.com>"
section = "net"
priority = "optional"
extended-description = "VPN Gate client: the vpngate daemon (systemd service) and a GTK4 app for connecting to the free relays of the VPN Gate academic project. Users in the vpngate group can connect."
depends = "$auto, iproute2, systemd, libgtk-4-1, libadwaita-1-0 (>= 1.5)"
recommends = "libsecret-tools"
maintainer-scripts = "../../../packaging/linux"
assets = [
    ["target/release/vpngate-daemon", "usr/bin/vpngate-daemon", "755"],
    ["target/release/vpngate-gtk", "usr/bin/vpngate-gtk", "755"],
    ["../../../assets/VPNGate.dat", "usr/share/vpngate/VPNGate.dat", "644"],
    ["../../../packaging/linux/vpngate.service", "lib/systemd/system/vpngate.service", "644"],
    ["../../../packaging/linux/net.vpngate.App.desktop", "usr/share/applications/net.vpngate.App.desktop", "644"],
    ["../../../assets/AppIcon-256.png", "usr/share/icons/hicolor/256x256/apps/net.vpngate.App.png", "644"],
]
