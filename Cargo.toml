[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[workspace.dependencies]
vpngate-core = { path = "crates/vpngate-core" }
vpngate-net = { path = "crates/vpngate-net" }
vpngate-platform = { path = "crates/vpngate-platform" }
vpngate-ipc-client = { path = "crates/vpngate-ipc-client" }
vpngate-testkit = { path = "crates/vpngate-testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
