name: Live relay checks
# Real network checks against public VPN Gate relays. Kept out of ci.yml: relays are volunteer-run and come and go,
# so this must never gate a merge or a release. It answers "does the protocol still work against real servers?"
# (handshake, DHCP, signed list sync) from a GitHub runner, which is not a censored network. It also checks that the
# system-trust verifier accepts a public CA certificate.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      relays:
        description: "Optional ip:port list (comma separated) instead of relays from the bundled signed list"
        required: false
        default: ""

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (version pinned in rust-toolchain.toml)
        uses: ./.github/actions/rust-toolchain
      - name: Build the Rust daemon
        run: scripts/build.sh helper
      # Includes system_trust_accepts_a_public_ca_certificate (platform verifier against example.com).
      - name: Live tests (relays chosen from the bundled signed list unless overridden)
        env:
          VPNGATE_LIVE_RELAYS: ${{ inputs.relays }}
        run: |
          set -o pipefail
          cargo test --locked -p vpngate-daemon --test live -- --ignored --nocapture 2>&1 | tee live-report.txt
      - name: Probe sample of relays from the bundled list
        run: |
          set -o pipefail
          scripts/probe-sample.sh 20 | tee probe-report.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: live-reports, path: "*-report.txt" }
