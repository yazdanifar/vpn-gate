name: Release
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Tag must match VERSION
        run: test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: CHANGELOG must mention this version
        run: grep -q "$(tr -d '[:space:]' < VERSION)" CHANGELOG.md
      - run: scripts/lint.sh
      - name: Package.swift still builds
        run: swift build
      - run: scripts/build.sh all
      - run: scripts/test.sh --each
      - run: scripts/build-pkg.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/VPN Gate.pkg" --title "$GITHUB_REF_NAME" --generate-notes
