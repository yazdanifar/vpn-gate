name: Tunnel e2e (real relay)
# Full-tunnel check on throwaway runners (macOS, Linux, Windows): connect to a real relay from the bundled list, capture the
# default route and DNS, then stop the daemon hard and check that routes/DNS are restored. macOS and Linux also stop with
# INT and TERM. Never gates a merge: relays come and go.
on:
  schedule:
    - cron: "43 5 * * 1"
  workflow_dispatch:
    inputs:
      relay:
        description: "Optional relay ip (default: first relay of the bundled list that answers a probe)"
        required: false
        default: ""

jobs:
  e2e:
    name: e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain (version pinned in rust-toolchain.toml)
        uses: ./.github/actions/rust-toolchain
      - name: Build the Rust daemon
        shell: bash
        run: |
          if [ "$RUNNER_OS" = macOS ]; then scripts/build.sh helper
          else cargo build --release --locked -p vpngate-daemon; fi
      - name: Pick a relay that answers
        id: relay
        shell: bash
        env:
          RELAY: ${{ inputs.relay }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export VPNGATE_DAEMON=target/release/vpngate-daemon.exe
          elif [ "$RUNNER_OS" = Linux ]; then export VPNGATE_DAEMON=target/release/vpngate-daemon; fi
          if [ -z "$RELAY" ]; then
            # Capture first: awk exiting early would SIGPIPE the probe, which pipefail turns into exit 141.
            PROBED=$(scripts/probe-sample.sh 15 || true)
            RELAY=$(awk '/ ok$/ {split($1,a,":"); print a[1]; exit}' <<< "$PROBED")
          fi
          [ -n "$RELAY" ] || { echo "no relay answered a probe"; exit 1; }
          echo "ip=$RELAY" >> "$GITHUB_OUTPUT"
      - name: e2e (macOS; hard timeout and a route restore, so a hang cannot cut the runner off)
        if: runner.os == 'macOS'
        run: |
          trap 'sudo build/bin/vpngate-helper --daemon --uid 0 >/dev/null 2>&1 & sleep 2; kill $! 2>/dev/null; true' EXIT
          sudo timeout 600 scripts/e2e-tunnel.sh "${{ steps.relay.outputs.ip }}" 2>&1 | tee e2e-report.txt
      - name: e2e (Linux)
        if: runner.os == 'Linux'
        run: |
          trap 'sudo target/release/vpngate-daemon --daemon >/dev/null 2>&1 & sleep 2; sudo kill $! 2>/dev/null; true' EXIT
          sudo VPNGATE_DAEMON="$PWD/target/release/vpngate-daemon" timeout 600 scripts/e2e-tunnel-linux.sh "${{ steps.relay.outputs.ip }}" 2>&1 | tee e2e-report.txt
      - name: e2e (Windows; the runner user is an administrator)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          scripts/get-wintun.ps1 -Dest target/release | Out-Null
          # *>&1: the script prints with Write-Host (the information stream), which 2>&1 does not capture.
          scripts/e2e-tunnel.ps1 -Server "${{ steps.relay.outputs.ip }}" *>&1 | Tee-Object -FilePath "$env:GITHUB_WORKSPACE/e2e-report.txt"
          if ($LASTEXITCODE) { throw "e2e failed ($LASTEXITCODE)" }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: "e2e-report-${{ matrix.os }}", path: e2e-report.txt }
