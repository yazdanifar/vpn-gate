name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: scripts/lint.sh
  swiftpm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Package.swift still builds (guards against drift from scripts/build.sh)
        run: swift build
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: scripts/build.sh all
      - name: Test
        run: scripts/test.sh --each
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Tunnel test with the real utun and routes against a fake relay (macOS runner has passwordless sudo)
        if: runner.os == 'macOS'
        run: |
          cargo test --locked -p vpngate-daemon --test tunnel_hermetic --no-run
          BIN=$(ls -t target/debug/deps/tunnel_hermetic-* | grep -v '\.d$' | head -1)
          sudo "$BIN" --ignored --nocapture
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: VPNGate.Core tests (golden IPC JSON, client and view models against a fake daemon on a named pipe)
        run: dotnet test apps/windows/VPNGate.Tests --configuration Release
      - name: WinUI app builds (unpackaged, self-contained)
        run: dotnet build apps/windows/VPNGate.App --configuration Release -p:Platform=x64
  msi:
    runs-on: windows-latest
    needs: [rust, dotnet]
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet tool install --global wix --version 4.0.5
      - name: Build the MSI (service, wintun.dll, WinUI app)
        run: scripts/build-msi.ps1
        shell: pwsh
      - uses: actions/upload-artifact@v5
        with: { name: vpn-gate-msi, path: build/VPN-Gate.msi }
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-cov-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - name: Coverage thresholds (core >= 90%, engine files >= 80%)
        run: scripts/coverage-rs.sh
  package:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/build-pkg.sh
      - uses: actions/upload-artifact@v5
        with: { name: vpn-gate-pkg, path: build/VPN Gate.pkg }
