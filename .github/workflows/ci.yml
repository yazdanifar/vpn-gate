name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - run: scripts/lint.sh
  swiftpm:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Package.swift still builds (guards against drift from scripts/build.sh)
        run: swift build
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build
        run: scripts/build.sh all
      - name: Test
        run: scripts/test.sh --each
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  package:
    runs-on: macos-15
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain (version pinned in rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - run: scripts/build-pkg.sh
      - uses: actions/upload-artifact@v5
        with: { name: vpn-gate-pkg, path: build/VPN Gate.pkg }
